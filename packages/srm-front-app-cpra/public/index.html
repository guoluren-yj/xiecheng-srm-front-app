<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <link rel="icon" href="<%= BASE_URL %>favicon.ico">
  <meta name="x5-cache" content="disable">
  <meta name="x5-fullscreen" content="true">
  <meta name="full-screen" content="yes">
  <meta content="no-cache, no-store, must-revalidate" http-equiv="Cache-Control"/>
  <meta content="no-cache" http-equiv="Pragma"/>
  <meta content="0" http-equiv="Expires"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
  <link rel="stylesheet" href="css/loading.css"/>
  <script>
       function setEnvParam() {
           window._env=ENV_PARAM
       }
       setEnvParam();
  </script>
</head>
<body>
<noscript>
  <strong>
    We're sorry but SRM mobile doesn't work properly without JavaScript enabled. Please enable it to continue.
  </strong>
</noscript>
<div id="app">
  <div class="app-loading">
    <div class="circle-loading-svg">
      <svg viewBox="0 0 50 50">
        <circle cx="25" cy="25" r="20"/>
      </svg>
    </div>
  </div>
</div>

</body>
</html>
