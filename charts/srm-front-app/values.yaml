# Default values for api-gateway.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: open-registry.going-link.com/operation-srm/srm-front-app

# preJob:
#   timeout: 300
#   preConfig:
#     enable: true
#     db:
#       host: localhost
#       port: 3306
#       username: choerodon
#       password: 123456
#       dbname: iam_service
#       enabledelete: true
#       upattrs: sort

deployment:
  managementPort: 80

service:
  enable: false
  type: ClusterIP
  port: 80
  name: srm-front-app

ingress:
  enable: false

envFrom:
  - isrm-cm

env:
  open:

logs:
  parser: nginx

resources:
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources,such as Minikube. If you do want to specify resources,uncomment the following
  # lines,adjust them as necessary,and remove the curly braces after 'resources:'.
  limits:
    # cpu: 100m
    # memory: 2Gi
  requests:
    # cpu: 100m
    # memory: 1Gi

metrics:
  path: /actuator/prometheus
  group: spring-boot

persistence:
  enabled: false
  # existingClaim:
  # subPath:
